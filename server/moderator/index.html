<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AccessMate Moderation</title>
  <script type="module" src="/moderator/dashboard.js"></script>
  <style>
    :root {
      color-scheme: dark;
      font: 100%/1.5 system-ui, sans-serif;
      background: #171614;
      color: #f9f4e9;
    }
    body { max-width: 48rem; margin: 0 auto; padding: 1.5rem 1rem 3rem; }
    h1, h2, h3 { line-height: 1.25; overflow-wrap: anywhere; }
    h1, h2 { color: #f1c66d; }
    label, input { display: block; }
    input, button {
      box-sizing: border-box;
      font: inherit;
      min-height: 2.75rem;
      border: 1px solid #a99770;
      border-radius: .45rem;
      padding: .45rem .8rem;
    }
    input { width: min(100%, 26rem); margin-block: .4rem .8rem; background: #24211c; }
    button { background: #2a251c; color: #fff2d6; cursor: pointer; }
    button.primary { background: #f1c66d; color: #171614; font-weight: 600; }
    button:disabled { opacity: .65; cursor: wait; }
    :focus-visible { outline: 3px solid #9ae4ff; outline-offset: 3px; }
    .actions { display: flex; flex-wrap: wrap; gap: .6rem; }
    article {
      margin-block: .75rem;
      padding: 1rem;
      border: 1px solid #a99770;
      border-radius: .6rem;
      overflow-wrap: anywhere;
    }
    article h3, article p { margin: 0 0 .6rem; }
    summary { cursor: pointer; padding-block: .4rem; }
    dt { font-weight: 600; }
    dd { margin: 0 0 .5rem; }
    #status { min-height: 1.5em; }
  </style>
</head>
<body>
  <main>
    <h1>AccessMate Moderation</h1>
    <p id="status" role="status" aria-atomic="true"></p>
    <noscript><p>Enable JavaScript to sign in and review profiles.</p></noscript>

    <form id="sign-in" method="post" hidden>
      <label for="moderator-key">Moderator key</label>
      <input id="moderator-key" type="password" maxlength="128" autocomplete="current-password" required>
      <button class="primary">Sign in</button>
    </form>

    <div id="dashboard" hidden>
      <div class="actions">
        <button id="refresh" type="button">Refresh queue</button>
        <button id="sign-out" type="button">Sign out</button>
      </div>
      <section aria-labelledby="pending-heading">
        <h2 id="pending-heading" tabindex="-1">Pending profiles</h2>
        <div id="pending"></div>
      </section>
      <section aria-labelledby="reports-heading">
        <h2 id="reports-heading" tabindex="-1">Reported profiles</h2>
        <div id="reports"></div>
      </section>
    </div>
  </main>
</body>
</html>
